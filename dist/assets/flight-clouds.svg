<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
  <filter id="vapour" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".008 .012" numOctaves="4" seed="12" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .96 0 0 0 0 .97 0 0 0 0 .96 0 0 0 3.2 -1.25"/>
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <radialGradient id="soft"><stop offset="0" stop-color="white"/><stop offset=".48" stop-color="white" stop-opacity=".98"/><stop offset=".8" stop-color="white" stop-opacity=".55"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
  <mask id="banks"><rect width="1200" height="800" fill="black"/><ellipse cx="130" cy="130" rx="720" ry="490" fill="url(#soft)"/><ellipse cx="1140" cy="740" rx="720" ry="490" fill="url(#soft)"/></mask>
</defs>
<g mask="url(#banks)"><rect x="-20" y="-20" width="1240" height="840" fill="#f3f1e8" filter="url(#vapour)"/></g>
</svg>
